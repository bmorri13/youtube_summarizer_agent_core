# Docker Compose for YouTube Analyzer
#
# Only `fetcher` starts by default. Everything else is behind a compose profile,
# so a bare `docker compose up -d` (as the deploy workflow runs) brings up the
# cron fetcher and nothing else. Without profiles, `up -d` also started the
# interactive REPL, the HTTP server, and the one-shot `analyze` service — which
# ran against its placeholder default VIDEO_URL and wrote a junk note.
#
# Usage:
#   Deployed/default:      docker compose up -d                       (fetcher only)
#   Local development:     docker compose --profile dev up local
#   HTTP server mode:      docker compose --profile server up server
#   RAG chatbot:           docker compose --profile chatbot up -d chatbot
#   Single video:          VIDEO_URL="https://..." docker compose --profile tools up analyze
#   Cloudflare tunnel:     docker compose --profile tunnel up -d cloudflared

services:
  # Local development - interactive mode
  local:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: youtube-analyzer-local
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_DEFAULT_CHANNEL=${SLACK_DEFAULT_CHANNEL:-#youtube-summaries}
      - NOTES_BACKEND=local
      - NOTES_LOCAL_DIR=/app/notes
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./notes:/app/notes
      - ./.env:/app/.env:ro
    command: python run_local.py

  # Run a single video analysis
  analyze:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: youtube-analyzer-single
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - NOTES_BACKEND=local
      - NOTES_LOCAL_DIR=/app/notes
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./notes:/app/notes
    command: python agent.py "${VIDEO_URL:-https://www.youtube.com/watch?v=dQw4w9WgXcQ}"

  # HTTP server mode (FastAPI)
  server:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: youtube-analyzer-server
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - NOTES_BACKEND=local
      - NOTES_LOCAL_DIR=/app/notes
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./notes:/app/notes
    command: python server.py

  # RAG Chatbot — intentionally not started by default (not currently in use).
  # Bring it up with: docker compose --profile chatbot up -d chatbot
  chatbot:
    profiles: ["chatbot"]
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    container_name: youtube-chatbot
    ports:
      - "8081:8081"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHATBOT_MODEL_ID=${CHATBOT_MODEL_ID:-claude-sonnet-4-6}
      - KB_MAX_RESULTS=${KB_MAX_RESULTS:-5}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: python chatbot_server.py

  # Local transcript fetcher (runs on cron)
  fetcher:
    build:
      context: .
      dockerfile: Dockerfile.fetcher
    container_name: youtube-fetcher
    environment:
      - MONITOR_CHANNEL_URLS=${MONITOR_CHANNEL_URLS}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - NOTES_BACKEND=local
      - NOTES_LOCAL_DIR=/app/notes
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./notes:/app/notes
      - fetcher-logs:/var/log
    restart: unless-stopped

  # Cloudflare Tunnel for external access to the chatbot. Only useful alongside
  # the chatbot profile, and requires CLOUDFLARE_TUNNEL_TOKEN to be set.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  fetcher-logs:
